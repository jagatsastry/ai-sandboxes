name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Use Node.js 24 for actions (Node 20 is deprecated as of mid-2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  agent_dag_sandbox:
    name: agent_dag_sandbox · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_dag_sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pytest
        run: pip install --upgrade pip pytest
      - name: pytest
        run: python -m pytest -q
      - name: Run sample workflow end-to-end
        run: python -m examples.balanced_parens
      - name: Analyze trace
        run: python -m agentdag.analyze traces/balanced_parens.jsonl

  llm_rec_svc:
    name: llm_rec_svc · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_rec_svc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no torch/transformers; tests don't need them)
        run: |
          python -m pip install --upgrade pip pytest
          pip install numpy
      - name: pytest unit
        run: python -m pytest -q tests/test_unit.py
