name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Use Node.js 24 for actions (Node 20 is deprecated as of mid-2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint · ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Include the workflow file and requirements-lint.txt in the cache
          # key so pin bumps immediately invalidate cached wheels and we never
          # serve a stale linter version.
          cache-dependency-path: |
            requirements-lint.txt
            .github/workflows/ci.yml
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt
      - name: ruff check
        run: ruff check .
      - name: black --check
        run: black --check .

  agent_dag_sandbox:
    name: agent_dag_sandbox · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_dag_sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pytest
        run: pip install --upgrade pip pytest
      - name: pytest
        run: python -m pytest -q
      - name: Run sample workflow end-to-end
        run: python -m examples.balanced_parens
      - name: Analyze trace
        run: python -m agentdag.analyze traces/balanced_parens.jsonl

  llm_rec_svc:
    name: llm_rec_svc · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_rec_svc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no torch/transformers; tests don't need them)
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install numpy
      - name: pytest unit + batcher
        # test_smoke.py legitimately needs HF models, so it stays excluded here.
        run: python -m pytest -q tests/test_unit.py tests/test_batcher.py
